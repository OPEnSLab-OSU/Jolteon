<path d="M 1045 900 H 1095" stroke="#a45510" stroke-width="3"/>
<circle cx="1019" cy="900" r="7" fill="#a45510"/>
<text x="1107" y="896" class="label" fill="#a45510">LOW_SDI12 -&gt; U7 A</text>
<text x="1107" y="914" class="detail">SDI-12 data; not available for analog sampling</text>
<text x="829" y="898" class="pin">D9</text>
<text x="829" y="917" class="detail">PA07 | pad 21</text>
<rect x="1095" y="927" width="460" height="46" rx="7" fill="#fff" stroke="#13704e" stroke-opacity="0.3"/>
<path d="M 1045 950 H 1095" stroke="#13704e" stroke-width="3"/>
<circle cx="1019" cy="950" r="7" fill="#13704e"/>
<text x="1107" y="946" class="label" fill="#13704e">Q4 + Q5 -&gt; rail switches</text>
<text x="1107" y="964" class="detail">HIGH enables BOTH 5VRAIL and HIGHVRAIL</text>
<text x="829" y="948" class="pin">D6</text>
<text x="829" y="967" class="detail">PA20 | pad 20</text>
<rect x="1095" y="977" width="460" height="46" rx="7" fill="#fff" stroke="#13704e" stroke-opacity="0.3"/>
<path d="M 1045 1000 H 1095" stroke="#13704e" stroke-width="3"/>
<circle cx="1019" cy="1000" r="7" fill="#13704e"/>
<text x="1107" y="996" class="label" fill="#13704e">PMOS2 gate -&gt; 3VRAIL</text>
<text x="1107" y="1014" class="detail">LOW enables 3VRAIL; HIGH disables</text>
<text x="829" y="998" class="pin">D5</text>
<text x="829" y="1017" class="detail">PA15 | pad 19</text>
<rect x="1095" y="1027" width="460" height="46" rx="7" fill="#fff" stroke="#2564ac" stroke-opacity="0.3"/>
<path d="M 1045 1050 H 1095" stroke="#2564ac" stroke-width="3"/>
<circle cx="1019" cy="1050" r="7" fill="#2564ac"/>
<text x="1107" y="1046" class="label" fill="#2564ac">SCL -&gt; RTC + TCA9548A</text>
<text x="1107" y="1064" class="detail">R10 pull-up to switched 3VRAIL</text>
<text x="829" y="1048" class="pin">SCL / D21</text>
<text x="829" y="1067" class="detail">PA23 | pad 18</text>
<rect x="1095" y="1077" width="460" height="46" rx="7" fill="#fff" stroke="#2564ac" stroke-opacity="0.3"/>
<path d="M 1045 1100 H 1095" stroke="#2564ac" stroke-width="3"/>
<circle cx="1019" cy="1100" r="7" fill="#2564ac"/>
<text x="1107" y="1096" class="label" fill="#2564ac">SDA -&gt; RTC + TCA9548A</text>
<text x="1107" y="1114" class="detail">R9 pull-up to switched 3VRAIL</text>
<text x="829" y="1098" class="pin">SDA / D20</text>
<text x="829" y="1117" class="detail">PA22 | pad 17</text>
<text x="590" y="1187" class="detail">UART labels follow u-blox DCE input/output definitions.</text>
<rect x="45" y="1220" width="1510" height="240" rx="14" fill="#fff" stroke="#c5d1df"/>
<text x="66" y="1252" class="label" fill="#13704e">POWER RAIL REFERENCE</text>
<text x="66" y="1281" class="small">+3V3, 5VOUT and modem VCC_3.8V stay powered when D5/D6 turn the switched rails off.</text>
<text x="66" y="1308" class="small">Optional probe points: +3V3, 5VOUT, 3VRAIL, 5VRAIL, TP20 modem supply and J_SDI12 pin 1 (12V).</text>
<text x="66" y="1335" class="small">3V|5V probing header: pin 1 = 3VRAIL, pin 2 = 5VRAIL. J_SDI12: 1 = 12V, 2 = DATA, 3 = GND.</text>
<text x="66" y="1362" class="small">UART function: Feather TX -&gt; translator -&gt; SARA TXD (input); SARA RXD (output) -&gt; translator -&gt; Feather RX.</text>
<text x="66" y="1389" class="small">Mux: A0 tied HIGH, A1/A2 pulled LOW =&gt; 0x71; channels 0-3 gas, 4 pressure, 5-7 terminal I2C.</text>
<text x="66" y="1416" class="small">SPI1 connector: 1 = 5VOUT, 2 = +3V3, 3 = CLK, 4 = GND, 5 = DI/MOSI, 6 = DO/MISO.</text>
<text x="66" y="1443" class="small">A0-A2 accept only 0..3.3V. D9 is SDI data. Do not connect 5V/12V or tie the independent 3V supplies together.</text>
<text x="45" y="1490" class="small">Source: docs/Jolteon_Rewire.pdf + installed Loomified Feather M0 variant. Schematic-derived; physical continuity untested.</text>
</svg>
